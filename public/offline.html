<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#064e3b" />
  <title>SawitProNesia — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f2;color:#0b3d2e;font-family:Arial,sans-serif}.card{width:min(440px,100%);background:#fff;border:1px solid #dce8dc;border-radius:28px;padding:34px;box-shadow:0 22px 60px rgba(6,78,59,.10)}.mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#e9f5e7;margin-bottom:24px;overflow:hidden}.mark img{width:58px;height:58px;display:block}h1{font-size:28px;margin:0 0 10px}p{margin:0 0 22px;color:#617468;line-height:1.6}button{width:100%;border:0;border-radius:14px;padding:14px 18px;background:#0d7a3c;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.note{margin-top:18px;font-size:12px;color:#86968c;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"><img src="/icons/icon-192.png" alt="" width="58" height="58" /></div>
    <h1>Anda sedang offline</h1>
    <p>SawitProNesia memerlukan koneksi untuk membaca dan menyimpan data kebun terbaru. Data operasional tidak disimpan sebagai cache agar tidak menampilkan informasi yang sudah kedaluwarsa.</p>
    <button onclick="location.reload()">Coba hubungkan kembali</button>
    <div class="note">SawitProNesia · App Experience v10.5</div>
  </main>
</body>
</html>
